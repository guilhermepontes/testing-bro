name: Sitespeed.io weekly

on:
  schedule:
    # Mondays at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sitespeed:
    runs-on: ubuntu-latest
    environment: prd
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run sitespeed.io
        env:
          MEASUREMENT_EMAIL: ${{ secrets.MEASUREMENT_EMAIL }}
          MEASUREMENT_PASSWORD: ${{ secrets.MEASUREMENT_PASSWORD }}
        run: bash Sitespeed.io/run.sh

      - name: Upload HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitespeed-result-${{ github.run_id }}
          path: sitespeed-result
          retention-days: 14
          if-no-files-found: warn

      # .nojekyll must live at the gh-pages root so GitHub does not run Jekyll
      # (Jekyll strips sitespeed folders that start with _).
      - name: Prepare Pages folder
        run: |
          mkdir -p "pages/sitespeed/${{ github.run_id }}"
          cp -R sitespeed-result/. "pages/sitespeed/${{ github.run_id }}/"
          touch pages/.nojekyll

      - name: Deploy report to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: pages
          branch: gh-pages
          clean: false

      - name: Echo report URL
        run: |
          echo "Report URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/sitespeed/${{ github.run_id }}/"
